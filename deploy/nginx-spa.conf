# Serves a Vite SPA build. Caddy splits /api/v1 off to the API BEFORE traffic
# reaches nginx, so nginx only ever serves static assets + SPA history fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the service worker or the app shell (PWA correctness)
    location = /service-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html       { add_header Cache-Control "no-cache"; }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
