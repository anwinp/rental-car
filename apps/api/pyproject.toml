[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rcm-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",  # assert used in tests
    "S104",  # binding to all interfaces (needed for server)
    "B008",  # do not perform function calls in default arguments (FastAPI Depends pattern)
    "N805",  # first argument of a method should be named self (Pydantic validators)
]
exclude = [
    ".venv",
    "alembic/versions/",
    "__pycache__",
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "T20"]
"alembic/**/*.py" = ["E501"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_reexport = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redbeat.*",
    "stripe.*",
    "passlib.*",
    "jose.*",
    "fakeredis.*",
    "factory.*",
    "faker.*",
    "weasyprint.*",
    "jinja2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: marks tests as unit tests (mocked dependencies)",
    "integration: marks tests as integration tests (require real postgres)",
    "slow: slow tests (> 5s)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::DeprecationWarning:passlib",
    "ignore::DeprecationWarning:jose",
]
